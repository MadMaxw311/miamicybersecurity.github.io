# Current executive board, shown on /about/. Migrated from the old `Exec` model.
#
#   - name:     displayed name (HTML allowed)
#     position: displayed title — see the standard list below
#     rank:     controls display order, low to high
#     linkedin: optional; omit and no LinkedIn icon is rendered
#     photo:    optional; omit and the Anonymous emblem placeholder is used.
#               Put the file in assets/img/exec/ and reference it from the site
#               root, e.g. /assets/img/exec/jane-doe.jpg
#
# Standard positions and their ranks, carried over from the old admin's
# POSITION_RANKS so the board renders in the same order it always has:
#
#   0  President                       6  Membership Coordinator
#   1  Vice President                  7  Event Coordinator
#   2  Treasurer                       8  Social Media
#   3  Secretary                       9  CTF Lead
#   4  IT                             10  MUCSC Advisor
#   5  Strategic Partnership Chair    11  MUCTF Advisor
#
# The board renders four to a row, so a full row is four entries.


